services:
  - type: web
    name: mongo-migration-auditor-api
    runtime: python
    buildCommand: pip install .
    startCommand: uvicorn migration_auditor.api:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      # Pin a tested Python runtime; Render otherwise selects a date-dependent default.
      - key: PYTHON_VERSION
        value: 3.13.5
      - key: ALLOWED_ORIGINS
        sync: false
      # Optional exact project-scoped Vercel preview-origin pattern.
      # Keep empty if only the primary domain should be allowed.
      - key: ALLOWED_ORIGIN_REGEX
        sync: false
      # Public deployment uses a private persistent disk for the compact SQLite setup.
      # Set a long unique password in the Render dashboard; never use the example value.
      - key: SIMPLE_ADMIN_MODE
        value: true
      - key: SIMPLE_ADMIN_EMAIL
        sync: false
      - key: SIMPLE_ADMIN_PASSWORD
        sync: false
      - key: PRODUCT_DATABASE_PATH
        value: /var/data/migration_auditor_product.sqlite3
      - key: SESSION_COOKIE_SECURE
        value: true
    disk:
      name: auditor-product-data
      mountPath: /var/data
      sizeGB: 1
