<!doctype html><html lang="en"><head><meta charset="UTF-8" /><meta name="viewport" content="width=device-width,initial-scale=1" /><title>Account - Mongo Migration Auditor</title><link rel="stylesheet" href="styles.css" /><style>.auth{max-width:480px;margin:7vh auto}.auth input{width:100%;padding:11px;margin:5px 0 14px;border-radius:7px;border:1px solid #516b94;background:#0b1120;color:#e8edf7}.auth label{font-weight:700;font-size:.9rem}.tabs{display:flex;gap:8px;margin:0 0 18px;flex-wrap:wrap}.tabs button{background:#263752;color:#e8edf7}.tabs button.active{background:#22c55e;color:#06200f}.auth form[hidden]{display:none}</style></head><body><main class="container auth"><header><p class="eyebrow">ACCOUNT</p><h1>Welcome</h1><p>Sign in to continue.</p></header><section class="card"><div class="tabs"><button id="login-tab" class="active">Sign in</button><button id="admin-tab">Admin sign in</button><button id="signup-tab">Create account</button></div><p id="auth-message" role="status"></p><form id="login" autocomplete="off"><label>Email<input type="email" name="email" required autocomplete="off" /></label><label>Password<input type="password" name="password" required autocomplete="new-password" /></label><button id="login-button">Sign in</button></form><form id="signup" hidden autocomplete="off"><label>Display name<input name="display_name" required autocomplete="off" /></label><label>Workspace name<input name="organization_name" required autocomplete="off" /></label><label>Email<input type="email" name="email" required autocomplete="off" /></label><label>Password <small>(at least 12 characters)</small><input type="password" name="password" minlength="12" required autocomplete="new-password" /></label><button>Create workspace</button></form></section></main><script src="config.js"></script><script src="auth.js"></script></body></html>
