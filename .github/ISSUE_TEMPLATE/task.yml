name: Project task
description: Track a scoped, testable roadmap item.
title: "task: "
labels: ["type: task"]
body:
  - type: textarea
    id: outcome
    attributes:
      label: Intended outcome
      description: State a verifiable result, not just an activity.
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      description: Include test/demo evidence required to close this task.
    validations:
      required: true
  - type: textarea
    id: safety
    attributes:
      label: Safety and privacy considerations
      description: List affected data, credentials, trust boundaries, or state "None known".
    validations:
      required: true
