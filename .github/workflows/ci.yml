name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install package and development dependencies
        run: python -m pip install -e ".[dev]"
      - name: Verify dependency metadata
        run: python -m pip check
      - name: Lint
        run: python -m ruff check .
      - name: Test
        run: python -m pytest
  audit-fixture-gates:
    name: Offline audit fixture gates
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - name: Install package
        run: python -m pip install .
      - name: Verify dependency metadata
        run: python -m pip check
      - name: Verify safe, warning, blocking, and analyzer-error outcomes
        run: python scripts/check_ci_fixtures.py | tee audit-fixture-results.txt
      - name: Run B01-B10 synthetic benchmark
        run: python scripts/run_benchmark.py | tee benchmark-results.json
      - name: Upload offline audit-gate result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: offline-audit-fixture-results
          path: audit-fixture-results.txt
          if-no-files-found: error
      - name: Upload benchmark result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-results
          path: benchmark-results.json
          if-no-files-found: error
