[build-system]
requires = ["setuptools>=75.0"]
build-backend = "setuptools.build_meta"

[project]
name = "database-schema-migration-auditor"
version = "0.1.0"
description = "A safety-focused static auditor for supported MongoDB migration inputs."
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
authors = [{ name = "Database Schema Migration Auditor contributors" }]
classifiers = [
  "Development Status :: 2 - Pre-Alpha",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
]
dependencies = [
  "fastapi>=0.115,<1",
  "pymongo==4.10.1",
  "python-multipart>=0.0.20,<1",
  "uvicorn[standard]>=0.34,<1",
]

[project.optional-dependencies]
dev = [
  "httpx>=0.27,<1",
  "pytest==8.3.5",
  "ruff==0.8.6",
]

[project.urls]
Homepage = "https://github.com/NehaaGaikwad/Mongo-Migration-Auditor"
Repository = "https://github.com/NehaaGaikwad/Mongo-Migration-Auditor"

[project.scripts]
migration-auditor = "migration_auditor.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["-q", "-p", "no:cacheprovider"]
pythonpath = ["src"]
markers = [
  "integration: requires a disposable MongoDB instance configured by MIGRATION_AUDITOR_TEST_MONGODB_URI",
]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
ignore = ["E501"]
